version: '3.9'
services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: barber
      POSTGRES_PASSWORD: barber_password
      POSTGRES_DB: barber_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://barber:barber_password@postgres:5432/barber_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-prod-secret
      JWT_REFRESH_SECRET: your-prod-refresh-secret
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
